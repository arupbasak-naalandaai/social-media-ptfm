# Optional local Postgres (alternative to a native install).
# Use with DATABASE_URL=postgresql://postgres:postgres@localhost:5432/social_inbox
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: social_inbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
